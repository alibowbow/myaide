<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>들퍼레 홈</title>
<!--
  들퍼레 홈 화면 (HomeActivity). 준: "이 아이콘들을 혁신적으로 편리하게 사용, 정리할 수 있게(애플 맥북like)", "홈화면에 어플
  바로가기 아이콘들이 전체적으로 어질러져 있거든". So, after a Mac: a dock whose icons swell under the finger (slide along it and
  let go to open), the apps sorted into named stacks that open in place, Launchpad (every app, by stack) and a search that
  knows 초성 and can hand the words to 퍼레. 퍼레 홈's board on top (board.js); 퍼레 is still called with the edge handle.
  The app gives window.Gyeot (HomeActivity's bridge) and calls launcher.apps / board / badges / insets / home / back.
-->
<link rel="stylesheet" href="/board.css">
<style>
:root{--top:28px;--bottom:16px;--icon:56px;--dockIcon:52px}
html,body{background:transparent !important;overflow:hidden;touch-action:manipulation}
#home,.fan,.pad-body{touch-action:pan-y;overscroll-behavior:none;-webkit-overflow-scrolling:touch}
.chips{touch-action:pan-x}
body.launcher{position:fixed;inset:0}
/* Icons are never dragged or long-pressed as pictures (that ends a held folder's gesture): the button under them is what is touched. */
.launcher img{-webkit-user-drag:none;user-drag:none;pointer-events:none;-webkit-touch-callout:none}
/* the wallpaper decides the ink: dark words on a light picture, white on a dark one */
.launcher.light{--ink:#1c1c1e;--ink2:#4a4a52;--ink3:#7a7a84;--glass:rgba(255,255,255,.62);--glass-line:rgba(255,255,255,.7);--tile:rgba(255,255,255,.55);--shadow:0 10px 30px rgba(30,40,70,.16),0 2px 6px rgba(30,40,70,.08);--halo:0 1px 2px rgba(255,255,255,.7)}
.launcher.dark{--ink:#fff;--ink2:rgba(255,255,255,.82);--ink3:rgba(255,255,255,.6);--glass:rgba(30,30,40,.38);--glass-line:rgba(255,255,255,.18);--tile:rgba(255,255,255,.16);--shadow:0 10px 30px rgba(0,0,10,.32);--halo:0 1px 3px rgba(0,0,0,.45)}
.launcher.light .board,.launcher.dark .board{--card:var(--glass);--card-line:var(--glass-line);--shade:var(--shadow);color:var(--ink)}
.launcher .board{position:relative;inset:auto;background:none !important}
.launcher .board .sky{display:none}
.launcher .board .wrap{position:relative;padding-top:calc(var(--top) + 18px)}
.launcher .when{text-shadow:var(--halo)}
#home{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--bottom) + 118px);scrollbar-width:none;overscroll-behavior:none}
#home::-webkit-scrollbar{display:none}
.inner{max-width:880px;margin:0 auto}

/* search: tap, or pull down at the top */
.search{display:flex;align-items:center;gap:10px;margin:14px 18px 6px;padding:12px 16px;border-radius:16px;border:1px solid var(--glass-line);background:var(--glass);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);color:var(--ink2);font:inherit;font-size:15px;font-weight:600;width:calc(100% - 36px);text-align:left}
.search svg{width:18px;height:18px;flex:none}

/* stacks, like a Mac's desktop stacks: a pile of the app icons, its name under it */
.stacks{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 14px;padding:16px 20px 8px}
.stack{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;padding:0;font:inherit;color:var(--ink);min-width:0}
.pile{position:relative;width:100%;aspect-ratio:1;max-width:var(--folder,72px);border-radius:23%;background:var(--tile);border:1px solid var(--glass-line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:5%;padding:12%;transition:transform .5s var(--spring)}
.pile img{width:100%;height:100%;object-fit:contain}
.stack .name{font-size:12px;font-weight:700;letter-spacing:-.3px;text-shadow:var(--halo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stack.down .pile,.app.down .ic{transform:scale(.9);transition:transform .1s ease}
.badge{position:absolute;right:-5px;top:-5px;min-width:21px;height:21px;padding:0 6px;border-radius:999px;background:#ff3b30;color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 6px rgba(255,59,48,.4);border:2px solid rgba(255,255,255,.9)}

/* an app: its icon and name */
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;font:inherit;color:var(--ink);min-width:0}
.app .ic{position:relative;width:var(--icon);height:var(--icon);transition:transform .45s var(--spring)}
.app .ic img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(30,40,70,.18))}
.app .label{font-size:11.5px;font-weight:650;letter-spacing:-.3px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:var(--halo)}
.app .badge{right:-6px;top:-6px}

/* the dock */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--bottom) + 8px);display:flex;justify-content:center;pointer-events:none;z-index:5}
.shelf{pointer-events:auto;display:flex;align-items:flex-end;gap:10px;padding:9px 12px;border-radius:28px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);max-width:calc(100vw - 20px);touch-action:none}
.dk{position:relative;width:var(--dockIcon);height:var(--dockIcon);flex:none;transform-origin:50% 100%;transition:transform .35s var(--spring)}
.dk img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(30,40,70,.2))}
.dk .badge{right:-4px;top:-4px}
.dk.open::after{content:"";position:absolute;left:50%;bottom:-6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink2)}
.shelf.scrub .dk{transition:transform .08s linear}
.sep{width:1px;align-self:stretch;margin:4px 2px;background:var(--ink3);opacity:.4;flex:none}
.pad-btn{display:grid;place-items:center;border-radius:28%;background:linear-gradient(145deg,#f4f4f8,#d9dae3)}
.launcher.dark .pad-btn{background:linear-gradient(145deg,#4a4a5a,#2c2c38)}
.pad-btn svg{width:58%;height:58%}
.tip{position:fixed;z-index:9;padding:6px 11px;border-radius:10px;background:rgba(30,30,36,.86);color:#fff;font-size:13px;font-weight:700;white-space:nowrap;transform:translate(-50%,-100%);pointer-events:none;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}

/* a stack opened in place (a Mac's stack as a grid) */
.veil{position:fixed;inset:0;z-index:20;background:rgba(12,14,24,.22);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);opacity:0;transition:opacity .28s ease;display:none}
.launcher.light .veil{background:rgba(240,242,248,.28)}
.veil.on{display:block;opacity:1}
.fan{position:fixed;z-index:21;width:min(92vw,560px);max-height:min(72vh,620px);overflow-y:auto;overflow-x:hidden;padding:10px 12px 22px;background:none;border:0;box-shadow:none;opacity:0;transition:opacity .18s ease;display:none;scrollbar-width:none}
.fan::-webkit-scrollbar{display:none}
.fan.on{display:block}
.fan.shown{opacity:1}
.fan .label{font-size:12px;text-shadow:var(--halo)}
.fan .app .ic img{filter:drop-shadow(0 8px 16px rgba(10,14,30,.28))}
.fan .app.hot .ic{transform:scale(1.24) translateY(-5px)}
.fan .app.hot .label{font-weight:800}
.hint{margin:-8px 4px 12px;font-size:12px;font-weight:650;color:var(--ink2)}
.dk.hop{animation:hop .9s cubic-bezier(.3,.7,.4,1)}
@keyframes hop{0%,100%{transform:none}22%{transform:translateY(-24px)}44%{transform:none}64%{transform:translateY(-11px)}82%{transform:none}}
.fan h2{margin:0 4px 16px;font-size:26px;font-weight:800;letter-spacing:-.8px;color:var(--ink);text-shadow:var(--halo)}
.fan .grid-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px}

/* Launchpad: every app, by stack; the search on top */
.pad{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:rgba(18,20,30,.28);-webkit-backdrop-filter:blur(34px) saturate(1.5);backdrop-filter:blur(34px) saturate(1.5);opacity:0;transition:opacity .25s ease}
.launcher.light .pad{background:rgba(245,246,250,.42)}
.pad.on{display:flex}
.pad.shown{opacity:1}
.pad-top{display:flex;align-items:center;gap:10px;padding:calc(var(--top) + 14px) 18px 10px}
.field{flex:1;display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-line)}
.field svg{width:18px;height:18px;flex:none;color:var(--ink2)}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;font-weight:600;color:var(--ink)}
.field input::placeholder{color:var(--ink3)}
.close{border:0;background:none;font:inherit;font-size:15px;font-weight:700;color:var(--ink);padding:8px 4px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 18px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;padding:7px 13px;border-radius:999px;background:var(--glass);color:var(--ink);font:inherit;font-size:13px;font-weight:700}
.chip.on{background:var(--ink);color:var(--inkInv,#fff)}
.launcher.dark .chip.on{--inkInv:#1c1c1e}
.pad-body{flex:1;overflow-y:auto;padding:4px 18px calc(var(--bottom) + 30px);scrollbar-width:none}
.pad-body::-webkit-scrollbar{display:none}
.pad-body h3{margin:18px 4px 12px;font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:-.2px}
.grid-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px}
.ask{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:13px 14px;border-radius:16px;border:1px solid var(--glass-line);background:var(--glass);font:inherit;color:var(--ink);text-align:left}
.ask .dot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.ask b{font-size:14.5px;font-weight:750}.ask span{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.empty{padding:30px 4px;color:var(--ink2);font-size:14px;font-weight:600;text-align:center}

/* the long-press menu */
.menu{position:fixed;z-index:40;min-width:200px;max-width:80vw;padding:6px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:0 18px 50px rgba(10,14,30,.3);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);transform:scale(.85);opacity:0;transition:transform .35s var(--spring),opacity .15s;display:none}
.menu.on{display:block}.menu.shown{transform:none;opacity:1}
.menu button{display:block;width:100%;border:0;background:none;text-align:left;font:inherit;font-size:15px;font-weight:600;color:var(--ink);padding:11px 12px;border-radius:10px}
.menu button.down{background:rgba(127,127,140,.18)}
.menu .danger{color:#ff3b30}
.menu hr{border:0;height:1px;background:var(--ink3);opacity:.25;margin:4px 8px}
.menu .title{font-size:12px;font-weight:800;color:var(--ink2);padding:6px 12px 4px}

@media (max-width:420px){.shelf{gap:8px}}
@media (max-width:380px){:root{--icon:50px;--dockIcon:44px}.stacks{gap:14px 10px;padding:12px 14px 6px}.shelf{gap:7px;padding:8px 9px}.search{margin:12px 13px 4px;width:calc(100% - 26px)}}
@media (min-width:600px){:root{--icon:60px;--dockIcon:56px}.stacks{grid-template-columns:repeat(6,1fr);padding:18px 28px 8px}.grid-apps,.fan .grid-apps{grid-template-columns:repeat(6,1fr)}.search{margin:14px 28px 6px;width:calc(100% - 56px)}.pad-body .grid-apps{grid-template-columns:repeat(7,1fr)}}
</style>
</head>
<body class="launcher light">
<script>/*GYEOT*/</script>
<script src="/board.js"></script>
<main id="home"><div class="inner">
  <div id="boardHost"></div>
  <button class="search" id="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>앱 검색 · 퍼레에게 묻기</button>
  <div class="stacks" id="stacks"></div>
</div></main>
<nav class="dock"><div class="shelf" id="shelf"></div></nav>
<div class="tip" id="tip"></div>
<div class="veil" id="veil"></div>
<div class="fan" id="fan"></div>
<section class="pad" id="pad">
  <div class="pad-top"><label class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg><input id="q" type="search" placeholder="앱 · 초성(ㅋㅋㅇ) · 퍼레에게 묻기" autocomplete="off" enterkeyhint="go"></label><button class="close" id="padClose">닫기</button></div>
  <div class="chips" id="chips"></div>
  <div class="pad-body" id="padBody"></div>
</section>
<div class="menu" id="menu"></div>
<script>
"use strict";
const B = window.Gyeot || null;
const PAD_ICON = '<svg viewBox="0 0 24 24"><g fill="#ff6b4a"><circle cx="6" cy="6" r="2.3"/></g><g fill="#ffcd00"><circle cx="12" cy="6" r="2.3"/></g><g fill="#2dbe60"><circle cx="18" cy="6" r="2.3"/></g><g fill="#12b5a6"><circle cx="6" cy="12" r="2.3"/></g><g fill="#3182f6"><circle cx="12" cy="12" r="2.3"/></g><g fill="#7c5cff"><circle cx="18" cy="12" r="2.3"/></g><g fill="#af52de"><circle cx="6" cy="18" r="2.3"/></g><g fill="#ff3b5c"><circle cx="12" cy="18" r="2.3"/></g><g fill="#ff9f0a"><circle cx="18" cy="18" r="2.3"/></g></svg>';
const el = id => document.getElementById(id);
let APPS = [], BY = new Map(), DOCK = [], RECENT = [], STACKS = [], BADGES = {}, filter = "";
const iconOf = a => "/icon/" + encodeURIComponent(a.id) + ".png?v=" + a.v;
const badgeOf = a => BADGES[a.pkg] || 0;
const badgeHtml = n => n > 0 ? '<span class="badge">' + (n > 99 ? "99+" : n) + '</span>' : "";

/* ── the board on top ─────────────────────────────────────── */
window.boardGo = what => B && B.open(what);
window.boardRoom = () => Math.max(250, innerHeight * 0.47);
makeBoard(el("boardHost"));
if (G.dark) document.body.classList.replace("light", "dark");

/* ── drawing ──────────────────────────────────────────────── */
function appButton(a) {
  return '<button class="app" data-id="' + esc(a.id) + '"><span class="ic"><img alt="" loading="lazy" decoding="async" src="' + iconOf(a) + '">' + badgeHtml(badgeOf(a)) + '</span><span class="label">' + esc(a.label) + '</span></button>';
}
function sorted(list) { return list.slice().sort((x, y) => x.label.localeCompare(y.label, "ko", {numeric: true})); }
function drawStacks() {
  const out = [];
  for (const s of STACKS) {
    const apps = sorted(APPS.filter(a => a.stack === s.id)); if (!apps.length) continue;
    const n = apps.reduce((t, a) => t + badgeOf(a), 0);
    out.push('<button class="stack" data-stack="' + s.id + '"><span class="pile">' + apps.slice(0, 9).map(a => '<img alt="" decoding="async" src="' + iconOf(a) + '">').join("") + badgeHtml(n) + '</span><span class="name">' + esc(s.name) + ' ' + apps.length + '</span></button>');
  }
  el("stacks").innerHTML = out.join("");
}
function drawDock() {
  const ids = DOCK.filter(id => BY.has(id)); const recent = RECENT.filter(id => BY.has(id) && !ids.includes(id)).slice(0, innerWidth >= 600 ? 3 : 2);
  const size = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dockIcon")) || 52, gap = innerWidth <= 420 ? 8 : 10;
  const slots = Math.floor((Math.min(innerWidth, 900) - 44) / (size + gap)) - 1;
  const most = Math.max(3, slots); const room = slots - Math.min(ids.length, most);
  if (room < 2) recent.length = 0; else recent.length = Math.min(recent.length, room - 1);
  const one = id => { const a = BY.get(id); return '<div class="dk" data-id="' + esc(id) + '" aria-label="' + esc(a.label) + '"><img alt="" decoding="async" src="' + iconOf(a) + '">' + badgeHtml(badgeOf(a)) + '</div>'; };
  el("shelf").innerHTML = '<div class="dk pad-btn" data-pad="1" aria-label="모든 앱">' + PAD_ICON + '</div>' + ids.slice(0, most).map(one).join("") + (recent.length ? '<span class="sep"></span>' + recent.map(one).join("") : "");
}
function drawAll() { drawStacks(); drawDock(); if (el("pad").classList.contains("on")) drawPad(); }

/* ── launching ────────────────────────────────────────────── */
function launch(id, from) {
  const r = (from || document.body).getBoundingClientRect();
  if (from && from.classList.contains("dk")) { from.classList.remove("hop"); void from.offsetWidth; from.classList.add("hop"); }
  if (B) B.launch(id, r.left, r.top, r.width, r.height);
  RECENT = [id].concat(RECENT.filter(x => x !== id)).slice(0, 6);
  setTimeout(() => { closeFan(); closePad(); drawDock(); }, 350);
}

/* ── touch: press, long-press, tap ─────────────────────────── */
function press(root, selector, onTap, onLong) {
  root.addEventListener("pointerdown", e => {
    const t = e.target.closest(selector); if (!t || !root.contains(t)) return;
    const x = e.clientX, y = e.clientY; let gone = false, long = false;
    t.classList.add("down");
    const timer = setTimeout(() => { long = true; t.classList.remove("down"); onLong && onLong(t, x, y); }, 480);
    const move = ev => { if (Math.abs(ev.clientX - x) + Math.abs(ev.clientY - y) > 12) { gone = true; clearTimeout(timer); t.classList.remove("down"); } };
    const up = () => {
      clearTimeout(timer); t.classList.remove("down"); removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", cancel);
      if (!gone && !long) onTap(t);
    };
    const cancel = () => { gone = true; up(); };
    addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", cancel);
  });
}
press(el("stacks"), ".stack", t => openFan(t.dataset.stack, t), (t, x, y) => hold(t, x, y));
document.addEventListener("contextmenu", e => e.preventDefault());
press(document.body, ".app", t => launch(t.dataset.id, t.querySelector(".ic")), (t, x, y) => appMenu(t.dataset.id, x, y));
el("search").addEventListener("click", () => openPad(true));

/* The dock: slide a finger along it and the icons swell like a Mac's; let go on one to open it. */
(function dock() {
  const shelf = el("shelf"), tip = el("tip");
  let active = false, startX = 0, startY = 0, moved = false, over = null, longTimer = 0, longDone = false;
  const swell = x => {
    let best = null, bestD = 1e9;
    for (const d of shelf.querySelectorAll(".dk")) {
      const r = d.getBoundingClientRect(), cx = r.left + r.width / 2, dist = Math.abs(cx - x);
      const k = Math.max(0, 1 - dist / 130), s = 1 + 0.62 * Math.pow(k, 1.6);
      d.style.transform = "translateY(" + (-(s - 1) * 30).toFixed(1) + "px) scale(" + s.toFixed(3) + ")";
      if (dist < bestD) { bestD = dist; best = d; }
    }
    over = best;
    if (best) { const r = best.getBoundingClientRect(); tip.textContent = best.getAttribute("aria-label") || ""; tip.style.left = (r.left + r.width / 2) + "px"; tip.style.top = (r.top - 10) + "px"; tip.classList.toggle("on", !!tip.textContent); }
  };
  const rest = () => { shelf.classList.remove("scrub"); shelf.querySelectorAll(".dk").forEach(d => d.style.transform = ""); tip.classList.remove("on"); };
  shelf.addEventListener("pointerdown", e => {
    active = true; moved = false; longDone = false; startX = e.clientX; startY = e.clientY; shelf.setPointerCapture(e.pointerId);
    shelf.classList.add("scrub"); swell(e.clientX);
    clearTimeout(longTimer);
    longTimer = setTimeout(() => { if (!moved && over && over.dataset.id) { longDone = true; rest(); appMenu(over.dataset.id, startX, startY - 40, true); } }, 520);
  });
  shelf.addEventListener("pointermove", e => {
    if (!active) return;
    if (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) { moved = true; clearTimeout(longTimer); }
    swell(e.clientX);
  });
  const end = e => {
    if (!active) return; active = false; clearTimeout(longTimer);
    const r = shelf.getBoundingClientRect(), outside = e.clientY < r.top - 60;
    const target = over; rest();
    if (longDone || outside || !target || e.type === "pointercancel") return;
    if (target.dataset.pad) openPad(false); else launch(target.dataset.id, target);
  };
  shelf.addEventListener("pointerup", end); shelf.addEventListener("pointercancel", end);
})();

/* Pull down at the top: search. Pull up at the bottom: every app. */
/*
  Natural scrolling (a Mac's or a phone's): the fling is the WebView's own; at the top or bottom the content stretches a little
  under the finger and springs back. On the home screen, pulled down at the top it opens search, pulled up at the end every app.
*/
function elastic(box, inner, done) {
  let y0 = null, last = 0;
  box.addEventListener("touchstart", e => { if (e.touches.length !== 1 || holding) { y0 = null; return; } y0 = e.touches[0].clientY; last = 0; const i = inner(); if (i) i.style.transition = "none"; }, {passive: true});
  box.addEventListener("touchmove", e => {
    if (y0 == null || holding) return;
    const y = e.touches[0].clientY, atTop = box.scrollTop <= 0, atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 1;
    let d = 0;
    if (atTop && y > y0) d = y - y0; else if (atEnd && y < y0) d = y - y0; else y0 = y;
    last = d; const i = inner(); if (!i) return;
    const h = box.clientHeight, a = Math.abs(d);
    i.style.transform = d ? "translateY(" + (Math.sign(d) * (1 - 1 / (a * 0.55 / h + 1)) * h).toFixed(1) + "px)" : "";
  }, {passive: true});
  const end = () => {
    if (y0 == null) return; y0 = null; const i = inner();
    if (i) { i.style.transition = "transform .6s cubic-bezier(.2,1.3,.35,1)"; i.style.transform = ""; }
    if (done) done(last); last = 0;
  };
  box.addEventListener("touchend", end, {passive: true}); box.addEventListener("touchcancel", end, {passive: true});
}
(function pulls() {
  const home = el("home");
  elastic(home, () => home.firstElementChild, d => { if (d > 110) openPad(true); else if (d < -100) openPad(false); });
  // A long press on the home screen's empty space: the home screen's own menu.
  let t = 0;
  home.addEventListener("pointerdown", e => {
    if (e.target.closest(".app,.stack,.card,.buddy,.search,.shelf")) return;
    const x = e.clientX, y = e.clientY; clearTimeout(t);
    t = setTimeout(() => homeMenu(x, y), 600);
    const stop = () => { clearTimeout(t); removeEventListener("pointerup", stop); removeEventListener("pointercancel", stop); removeEventListener("pointermove", far); };
    const far = ev => { if (Math.abs(ev.clientX - x) + Math.abs(ev.clientY - y) > 12) stop(); };
    addEventListener("pointerup", stop); addEventListener("pointercancel", stop); addEventListener("pointermove", far);
  });
})();

/* ── a stack opened in place: its icons fly out of the folder, and back in when it closes ── */
let fanFrom = null, holding = false, holdEnded = 0;
function openFan(id, from, held) {
  const s = STACKS.find(x => x.id === id); if (!s) return;
  const apps = sorted(APPS.filter(a => a.stack === id)), fan = el("fan"), r = from.getBoundingClientRect();
  fan.getAnimations().forEach(a => a.cancel());
  fan.innerHTML = '<h2>' + esc(s.name) + '</h2>' + (held ? '<div class="hint">손가락을 앱 위로 옮기고 떼면 열려요</div>' : "") + '<div class="grid-apps">' + apps.map(appButton).join("") + '</div>';
  fan.classList.remove("shown"); fan.classList.add("on"); fan.scrollTop = 0;
  // Beside the folder: above it when there is room, else below, else in the middle.
  const w = fan.offsetWidth, h = fan.offsetHeight, cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const topMost = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--top")) + 8, floor = innerHeight - 20;
  const left = Math.max(10, Math.min(innerWidth - w - 10, cx - w / 2));
  const top = r.top - h - 14 >= topMost ? r.top - h - 14 : r.bottom + 14 + h <= floor ? r.bottom + 14 : Math.max(topMost, (innerHeight - h) / 2);
  fan.style.left = left + "px"; fan.style.top = top + "px"; fan.style.transformOrigin = (cx - left) + "px " + (cy - top) + "px";
  fanFrom = {cx, cy, left, top};
  el("veil").classList.add("on");
  requestAnimationFrame(() => { fan.classList.add("shown"); fly(fan, false); });
}
/** Each icon from the folder's middle to its place with a spring (or back into it), one after another. */
function fly(fan, back) {
  if (!fanFrom) return;
  const icons = Array.from(fan.querySelectorAll(".app"));
  icons.forEach((a, i) => {
    const x = fanFrom.left + a.offsetLeft + a.offsetWidth / 2, y = fanFrom.top + a.offsetTop + a.offsetHeight / 2 - fan.scrollTop;
    const away = "translate(" + (fanFrom.cx - x).toFixed(1) + "px," + (fanFrom.cy - y).toFixed(1) + "px) scale(.22)";
    if (back) a.animate([{transform: "none", opacity: 1}, {transform: away, opacity: 0}], {duration: 220, delay: Math.min(i * 8, 90), easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards"});
    else a.animate([{transform: away, opacity: 0}, {transform: "none", opacity: 1}], {duration: 560, delay: Math.min(i * 22, 300), easing: "cubic-bezier(.34,1.5,.64,1)", fill: "backwards"});
  });
}
function closeFan() {
  const fan = el("fan"); if (!fan.classList.contains("on")) return;
  fly(fan, true); fan.classList.remove("shown"); el("veil").classList.remove("on");
  setTimeout(() => { fan.classList.remove("on"); fan.innerHTML = ""; }, 260);
}
/**
  Held down (a Mac's stack held in the dock): it pops out; the finger slides to an app (it swells) and letting go opens it.
  Near the panel's top or bottom it scrolls by itself, faster the nearer. Let go elsewhere and it stays open.
*/
function hold(tile, x, y) {
  openFan(tile.dataset.stack, tile, true);
  holding = true; if (navigator.vibrate) try { navigator.vibrate(14); } catch (e) {}
  const fan = el("fan"); let hot = null, lastX = x, lastY = y, raf = 0;
  const still = e => { if (e.cancelable) e.preventDefault(); };
  document.addEventListener("touchmove", still, {passive: false});
  const mark = () => {
    const t = document.elementFromPoint(lastX, lastY), a = t && t.closest ? t.closest("#fan .app") : null;
    if (a !== hot) { if (hot) hot.classList.remove("hot"); hot = a; if (hot) { hot.classList.add("hot"); if (navigator.vibrate) try { navigator.vibrate(6); } catch (e) {} } }
  };
  const drift = () => {
    const r = fan.getBoundingClientRect(), zone = 60; let v = 0;
    if (lastX >= r.left && lastX <= r.right) { if (lastY < r.top + zone) v = -(r.top + zone - lastY) / 3.5; else if (lastY > r.bottom - zone) v = (lastY - (r.bottom - zone)) / 3.5; }
    if (v) { fan.scrollTop += Math.max(-22, Math.min(22, v)); mark(); }
    raf = requestAnimationFrame(drift);
  };
  raf = requestAnimationFrame(drift);
  const move = e => { lastX = e.clientX; lastY = e.clientY; mark(); };
  const up = e => {
    cancelAnimationFrame(raf); document.removeEventListener("touchmove", still);
    removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
    holding = false; holdEnded = Date.now();
    const hint = fan.querySelector(".hint"); if (hint) hint.remove();
    if (hot) { const id = hot.dataset.id, ic = hot.querySelector(".ic"); hot.classList.remove("hot"); if (e.type === "pointerup") launch(id, ic); }
  };
  addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
}
el("veil").addEventListener("click", () => { if (Date.now() - holdEnded < 400) return; closeFan(); closeMenu(); });
elastic(el("fan"), () => el("fan").querySelector(".grid-apps"));

/* ── Launchpad and search ──────────────────────────────────── */
function openPad(typing) {
  closeFan(); closeMenu();
  const pad = el("pad"); filter = ""; el("q").value = ""; drawChips(); drawPad();
  pad.classList.add("on"); requestAnimationFrame(() => pad.classList.add("shown"));
  if (typing) setTimeout(() => el("q").focus(), 60);
}
function closePad() { const pad = el("pad"); if (!pad.classList.contains("on")) return; el("q").blur(); pad.classList.remove("shown"); setTimeout(() => pad.classList.remove("on"), 230); }
el("padClose").addEventListener("click", closePad);
function drawChips() {
  const have = STACKS.filter(s => APPS.some(a => a.stack === s.id));
  el("chips").innerHTML = '<button class="chip' + (filter ? "" : " on") + '" data-f="">전체</button>' + have.map(s => '<button class="chip' + (filter === s.id ? " on" : "") + '" data-f="' + s.id + '">' + esc(s.name) + '</button>').join("");
}
el("chips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return; filter = c.dataset.f; drawChips(); drawPad(); });
function initials(t) {
  const I = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ"; let o = "";
  for (const ch of t) { const c = ch.charCodeAt(0); o += c >= 0xAC00 && c <= 0xD7A3 ? I[Math.floor((c - 0xAC00) / 588)] : /\s/.test(ch) ? "" : ch.toLowerCase(); }
  return o;
}
function score(q, a) {
  q = q.trim().toLowerCase().replace(/\s+/g, ""); if (!q) return 0;
  const l = a.label.toLowerCase(), flat = l.replace(/\s+/g, "");
  if (flat.startsWith(q)) return 100 - Math.min(40, flat.length - q.length);
  if (l.split(/\s+/).some(w => w.startsWith(q))) return 70;
  if (flat.includes(q)) return 55;
  if (/^[ㄱ-ㅎ]+$/.test(q)) { const i = initials(l); if (i.startsWith(q)) return 60; if (i.includes(q)) return 45; }
  if (q.length >= 3 && a.pkg.toLowerCase().includes(q)) return 20;
  return 0;
}
function drawPad() {
  const q = el("q").value.trim(), body = el("padBody");
  el("chips").style.display = q ? "none" : "";
  if (q) {
    const hits = APPS.map(a => [score(q, a), a]).filter(x => x[0] > 0).sort((x, y) => y[0] - x[0] || x[1].label.localeCompare(y[1].label, "ko", {numeric: true})).slice(0, 16).map(x => x[1]);
    body.innerHTML = '<div class="pad-inner">' + (hits.length ? '<h3>앱</h3><div class="grid-apps">' + hits.map(appButton).join("") + '</div>' : '<div class="empty">그런 이름의 앱이 없어요</div>')
      + '<h3>그 밖에</h3>'
      + '<button class="ask" data-ask="1"><span class="dot" style="background:linear-gradient(140deg,#ff9a76,#ff6a45)"><svg viewBox="0 0 24 24" width="18" height="18" fill="#fff"><path d="M12 2.5l2.1 6.2 6.4 2.3-6.4 2.3L12 19.5l-2.1-6.2L3.5 11l6.4-2.3z"/></svg></span><span><b>퍼레에게 묻기</b><span>‘' + esc(q) + '’</span></span></button>'
      + '<button class="ask" data-web="1"><span class="dot" style="background:#3182f6"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></span><span><b>웹에서 찾기</b><span>‘' + esc(q) + '’</span></span></button></div>';
    return;
  }
  const shown = filter ? STACKS.filter(s => s.id === filter) : STACKS;
  body.innerHTML = '<div class="pad-inner">' + shown.map(s => { const apps = sorted(APPS.filter(a => a.stack === s.id)); return apps.length ? '<h3>' + esc(s.name) + ' · ' + apps.length + '</h3><div class="grid-apps">' + apps.map(appButton).join("") + '</div>' : ""; }).join("") + '</div>';
  if (!body.querySelector(".app")) body.innerHTML = '<div class="pad-inner"><div class="empty">앱을 불러오는 중…</div></div>';
}
el("q").addEventListener("input", drawPad);
elastic(el("padBody"), () => el("padBody").firstElementChild);
el("q").addEventListener("keydown", e => {
  if (e.key !== "Enter") return; e.preventDefault();
  const first = el("padBody").querySelector(".app");
  if (first) launch(first.dataset.id, first.querySelector(".ic")); else ask();
});
function ask() { const q = el("q").value.trim(); if (q && B) { B.ask(q); closePad(); } }
el("padBody").addEventListener("click", e => {
  if (e.target.closest("[data-ask]")) ask();
  else if (e.target.closest("[data-web]")) { const q = el("q").value.trim(); if (q && B) { B.web(q); closePad(); } }
});

/* ── menus ────────────────────────────────────────────────── */
function showMenu(html, x, y) {
  const m = el("menu"); m.innerHTML = html; m.classList.add("on");
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(10, Math.min(innerWidth - w - 10, x - w / 2)) + "px";
  m.style.top = Math.max(10, Math.min(innerHeight - h - 10, y + 12)) + "px";
  m.style.transformOrigin = "50% 0";
  el("veil").classList.add("on"); requestAnimationFrame(() => m.classList.add("shown"));
  if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
}
function closeMenu() { const m = el("menu"); if (!m.classList.contains("on")) return; m.classList.remove("shown", "on"); if (!el("fan").classList.contains("on")) el("veil").classList.remove("on"); }
function appMenu(id, x, y) {
  const a = BY.get(id); if (!a) return;
  const inDock = DOCK.includes(id), at = DOCK.indexOf(id);
  showMenu('<div class="title">' + esc(a.label) + '</div>'
    + '<button data-do="dock">' + (inDock ? "독에서 빼기" : "독에 넣기") + '</button>'
    + (inDock && at > 0 ? '<button data-do="left">독에서 왼쪽으로</button>' : "")
    + (inDock && at < DOCK.length - 1 ? '<button data-do="right">독에서 오른쪽으로</button>' : "")
    + '<button data-do="move">다른 묶음으로 옮기기</button><hr><button data-do="info">앱 정보</button><button data-do="uninstall" class="danger">삭제</button>', x, y);
  el("menu").onclick = e => {
    const b = e.target.closest("button"); if (!b) return; const what = b.dataset.do;
    if (what === "move") { stackMenu(id, x, y); return; }
    closeMenu();
    if (what === "dock") { DOCK = inDock ? DOCK.filter(d => d !== id) : DOCK.concat(id); B && B.dock(JSON.stringify(DOCK)); drawDock(); }
    else if (what === "left" || what === "right") { const j = at + (what === "left" ? -1 : 1); [DOCK[at], DOCK[j]] = [DOCK[j], DOCK[at]]; B && B.dock(JSON.stringify(DOCK)); drawDock(); }
    else if (what === "info") B && B.info(id);
    else if (what === "uninstall") B && B.uninstall(id);
  };
}
function stackMenu(id, x, y) {
  const a = BY.get(id);
  showMenu('<div class="title">' + esc(a.label) + ' · 옮길 묶음</div>' + STACKS.map(s => '<button data-s="' + s.id + '">' + (a.stack === s.id ? "✓ " : "") + esc(s.name) + '</button>').join("") + '<hr><button data-s="">자동으로 정하기</button>', x, Math.min(y, innerHeight * 0.25));
  el("menu").onclick = e => {
    const b = e.target.closest("button"); if (!b) return; closeMenu(); closeFan();
    B && B.move(id, b.dataset.s);
  };
}
function homeMenu(x, y) {
  showMenu('<button data-do="wallpaper">배경화면 바꾸기</button><button data-do="decor">화면 꾸미기</button><button data-do="all">모든 앱</button><hr><button data-do="home">원래 홈 화면으로</button>', x, y);
  el("menu").onclick = e => { const b = e.target.closest("button"); if (!b) return; closeMenu(); if (b.dataset.do === "all") openPad(false); else B && B.settings(b.dataset.do); };
}

/* ── the app's calls ──────────────────────────────────────── */
window.launcher = {
  apps(k) {
    APPS = k.apps || []; BY = new Map(APPS.map(a => [a.id, a])); DOCK = k.dock || []; RECENT = k.recent || []; STACKS = k.stacks || []; BADGES = k.badges || {};
    drawAll();
  },
  board(k) { setBoardData(k); },
  badges(k) { BADGES = k || {}; drawAll(); },
  insets(top, bottom) { document.documentElement.style.setProperty("--top", top + "px"); document.documentElement.style.setProperty("--bottom", bottom + "px"); boards.forEach(fit); },
  /** Home pressed while the home screen is in front: back to its top, everything closed (a Mac's desktop). */
  home() { closeMenu(); closeFan(); closePad(); el("home").scrollTo({top: 0, behavior: "smooth"}); },
  /** Back: the open thing closes; true when something did. */
  back() {
    if (el("menu").classList.contains("on")) { closeMenu(); return true; }
    if (el("fan").classList.contains("on")) { closeFan(); return true; }
    if (el("pad").classList.contains("on")) { closePad(); return true; }
    return false;
  },
  resized() { drawDock(); boards.forEach(fit); }
};
addEventListener("resize", () => launcher.resized());
if (B) { B.ready(); } else {
  // Opened outside the app (a browser, a check): a few sample apps so the page can be seen.
  launcher.apps({stacks: [{id: "money", name: "금융·투자"}, {id: "chat", name: "메신저·SNS"}, {id: "ai", name: "AI"}], apps: [], dock: []});
}
