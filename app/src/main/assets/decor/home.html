<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>퍼레 홈</title>
<!--
  퍼레 홈 (화면 꾸미기's home-screen board). 준: "자비스 같이", "사이버틱하게 디자인 하지 말기", "닌텐도나 애플 like 디자인으로".
  So: no neon, grids or scan lines. Soft daylight colors that follow the hour, frosted rounded cards like phone widgets,
  a friend who hops when touched. It keeps to the top half: the rest is the home screen's own icons. Each launcher page has its slot (the
  photo, this board, or a web piece) and the slots slide with the pages. 퍼레 is still called with the edge handle.
  The app sets window.GYEOT (the slots) where the marker below is, and calls board.at(page) and board.data({...}).
-->
<style>
:root{
  --ink:#1c1c1e; --ink2:#6b6b73; --ink3:#9a9aa3;
  --card:rgba(255,255,255,.74); --card-line:rgba(255,255,255,.65); --shade:0 10px 30px rgba(40,52,90,.13),0 2px 6px rgba(40,52,90,.07);
  --up:#f04452; --down:#3182f6; --ok:#2dbe60; --warn:#ff9f0a; --bad:#ff453a;
  --spring:cubic-bezier(.34,1.56,.64,1); --soft:cubic-bezier(.22,1,.36,1);
  --font:ui-rounded,"SF Pro Rounded","Samsung One","SamsungOneUI","Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#dfeefe;font-family:var(--font);word-break:keep-all;overflow-wrap:break-word;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
#track{position:absolute;inset:0;will-change:transform}
.slot{position:absolute;top:0;width:100vw;height:100%;overflow:hidden}
.slot iframe{border:0;width:100%;height:100%;display:block;background:#101010}
.photo{position:absolute;inset:0;background:linear-gradient(160deg,#ffe3d3,#dcefff) center/cover no-repeat}
.photo .hint{position:absolute;left:24px;right:24px;top:44%;text-align:center;color:#5b5b66;font-size:15px;line-height:1.5}

/* ── the sky under the board ───────────────────────────────── */
.board{position:absolute;inset:0;color:var(--ink);transition:background 2s ease}
.board[data-tone=morning]{background:linear-gradient(165deg,#ffe2d1 0%,#fff2e4 46%,#d8ecff 100%)}
.board[data-tone=day]{background:linear-gradient(165deg,#bfe2ff 0%,#e7f4ff 52%,#fff3dd 100%)}
.board[data-tone=evening]{background:linear-gradient(165deg,#ffc6b3 0%,#f4d4f6 50%,#c6d2ff 100%)}
.board[data-tone=night]{background:linear-gradient(165deg,#252c5e 0%,#30306f 55%,#403b7c 100%)}
.board[data-tone=night]{--ink:#fff;--ink2:rgba(255,255,255,.72);--ink3:rgba(255,255,255,.5);--card:rgba(255,255,255,.13);--card-line:rgba(255,255,255,.16);--shade:0 10px 30px rgba(8,10,40,.28)}
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(38px);opacity:.55;will-change:transform}
.b1{width:62vw;height:62vw;left:-14vw;top:8vh;animation:drift1 26s ease-in-out infinite}
.b2{width:54vw;height:54vw;right:-16vw;top:34vh;animation:drift2 31s ease-in-out infinite}
.b3{width:48vw;height:48vw;left:18vw;bottom:-6vh;animation:drift3 36s ease-in-out infinite}
.board[data-tone=morning] .b1{background:#ffb59e}.board[data-tone=morning] .b2{background:#ffd98a}.board[data-tone=morning] .b3{background:#a9d8ff}
.board[data-tone=day] .b1{background:#8cc8ff}.board[data-tone=day] .b2{background:#ffe08a}.board[data-tone=day] .b3{background:#b5efd6}
.board[data-tone=evening] .b1{background:#ff9f8a}.board[data-tone=evening] .b2{background:#d9a8ff}.board[data-tone=evening] .b3{background:#9fb5ff}
.board[data-tone=night] .blob{opacity:.32}.board[data-tone=night] .b1{background:#5b6cff}.board[data-tone=night] .b2{background:#9a6bff}.board[data-tone=night] .b3{background:#3fb6c9}
@keyframes drift1{50%{transform:translate(12vw,6vh) scale(1.08)}}
@keyframes drift2{50%{transform:translate(-10vw,-5vh) scale(.94)}}
@keyframes drift3{50%{transform:translate(8vw,-8vh) scale(1.1)}}
.stars{position:absolute;inset:0;display:none}
.board[data-tone=night] .stars{display:block}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.0;animation:twinkle 5s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.85}}

/* ── the board ─────────────────────────────────────────────── */
.wrap{position:absolute;left:0;right:0;top:0;padding:max(54px,7vh) 18px 0;display:flex;flex-direction:column;gap:12px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;min-height:106px}
.when{padding-left:4px}
.date{font-size:15px;font-weight:650;color:var(--ink2);letter-spacing:-.2px}
.clock{font-size:62px;line-height:1;font-weight:750;letter-spacing:-2.5px;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.clock small{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-right:6px;color:var(--ink2)}
.hello{font-size:16px;font-weight:650;color:var(--ink)}
.locked .when .date,.locked .when .clock{display:none}

.buddy{position:relative;width:104px;height:118px;border:0;padding:0;background:none;flex:none}
.buddy .body{position:absolute;left:8px;right:8px;bottom:14px;height:88px;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.buddy .body img,.buddy .body svg{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 6px 10px rgba(40,52,90,.18))}
.buddy .body img.round{width:80px;height:80px;margin:4px auto 0;border-radius:50%;border:3px solid #fff;object-fit:cover;box-shadow:0 6px 14px rgba(40,52,90,.2);filter:none}
.buddy .ground{position:absolute;left:26px;right:26px;bottom:6px;height:10px;border-radius:50%;background:rgba(30,40,80,.16);animation:ground 3.2s ease-in-out infinite}
.board[data-tone=night] .buddy .ground{background:rgba(0,0,10,.3)}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes ground{50%{transform:scaleX(.86);opacity:.7}}
.buddy.hop .body{animation:hop .72s var(--soft)}
.buddy.hop .ground{animation:groundhop .72s var(--soft)}
@keyframes hop{0%{transform:none}14%{transform:scale(1.14,.84)}42%{transform:translateY(-34px) scale(.92,1.08)}70%{transform:translateY(0) scale(1.1,.9)}84%{transform:scale(.97,1.03)}100%{transform:none}}
@keyframes groundhop{42%{transform:scaleX(.55);opacity:.4}}
.buddy.wiggle .body{animation:wiggle .9s ease-in-out}
@keyframes wiggle{20%{transform:rotate(-7deg)}45%{transform:rotate(6deg)}70%{transform:rotate(-3deg)}100%{transform:none}}
.zz{position:absolute;right:10px;top:12px;font-size:15px;font-weight:800;color:var(--ink2);opacity:0;display:none}
.board[data-tone=night] .zz{display:block;animation:zz 3.6s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,8px) scale(.7)}40%{opacity:.9}100%{opacity:0;transform:translate(10px,-14px) scale(1.1)}}
.bubble{position:absolute;right:66px;bottom:84px;max-width:230px;width:max-content;padding:10px 14px;border-radius:18px 18px 4px 18px;background:#fff;color:#1c1c1e;font-size:14px;font-weight:650;line-height:1.35;box-shadow:var(--shade);opacity:0;transform:translateY(8px) scale(.85);transform-origin:100% 100%;transition:opacity .25s,transform .45s var(--spring);pointer-events:none;text-align:left}
.bubble.on{opacity:1;transform:none}

.think{position:absolute;left:-6px;top:-2px;display:none;align-items:center;gap:5px;padding:6px 10px 6px 8px;border-radius:999px;background:#fff;color:#1c1c1e;box-shadow:var(--shade);font-size:12.5px;font-weight:800;z-index:2}
.think::after{content:"";position:absolute;right:6px;bottom:-7px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(40,52,90,.12)}
.think.on{display:inline-flex;animation:pop .6s var(--spring) both}
.dots{display:inline-flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;background:#7c5cff;animation:dot 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s;background:#ff6b4a}.dots i:nth-child(3){animation-delay:.3s;background:#12b5a6}
@keyframes dot{30%{transform:translateY(-4px)}60%{transform:none}}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;border-radius:26px;padding:15px 16px;background:var(--card);border:1px solid var(--card-line);box-shadow:var(--shade);-webkit-backdrop-filter:blur(20px) saturate(1.7);backdrop-filter:blur(20px) saturate(1.7);overflow:hidden;transition:transform .5s var(--spring),opacity .4s ease}
.card.wide{grid-column:span 2}
.card.hidden{display:none}
.pop{animation:pop .7s var(--spring) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.92)}}
.tap.down{transform:scale(.955);transition:transform .12s ease}
.eyebrow{font-size:12.5px;font-weight:750;color:var(--ink2);display:flex;align-items:center;gap:6px;letter-spacing:-.1px}
.eyebrow svg{width:15px;height:15px;flex:none}

/* 다음 일정 */
.event{display:flex;align-items:center;gap:14px}
.cal{flex:none;width:58px;height:62px;border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(40,52,90,.10)}
.cal .dow{font-size:11.5px;font-weight:800;color:#ff3b30;line-height:1}
.cal .day{font-size:28px;font-weight:750;color:#1c1c1e;line-height:1.08;letter-spacing:-1px}
.ev{flex:1;min-width:0}
.ev-title{font-size:16.5px;font-weight:750;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.ev-meta{font-size:13px;font-weight:550;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soon{flex:none;align-self:flex-start;font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px;background:rgba(255,59,48,.12);color:#ff3b30}
.soon.now{background:rgba(45,190,96,.14);color:#1fa652}
.soon:empty{display:none}


/* 코인: one slim row, a coin each side */
.coins{display:flex;flex-direction:column;gap:6px}
.coin-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.coin{display:flex;flex-direction:column;gap:2px;min-width:0;white-space:nowrap}
.coin b{font-size:12.5px;font-weight:800;color:var(--ink2)}
.coin .px{font-size:18px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.pct{align-self:flex-start;font-size:12px;font-weight:800;padding:2px 7px;border-radius:8px;font-variant-numeric:tabular-nums}
.pct.up{color:var(--up);background:rgba(240,68,82,.11)}.pct.down{color:var(--down);background:rgba(49,130,246,.11)}
.coin-list .muted{grid-column:1/-1}
.btc{width:16px;height:16px;border-radius:50%;background:#f7931a;color:#fff;font-size:10.5px;font-weight:900;display:inline-grid;place-items:center}
.muted{color:var(--ink3);font-size:13px;font-weight:600}

/* 알림 */
.notices .list{display:flex;flex-direction:column;gap:8px;margin-top:9px}
.note{display:flex;align-items:center;gap:10px;min-width:0}
.note .app{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.note .words{flex:1;min-width:0}
.note .t{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.note .s{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note .ago{flex:none;font-size:11.5px;color:var(--ink3);font-weight:650}
.count{margin-left:auto;font-size:12px;font-weight:800;color:#fff;background:#ff3b30;border-radius:999px;padding:2px 8px}

/* 퍼레의 제안 */
.idea{display:flex;gap:12px;align-items:flex-start}
.idea .spark{flex:none;width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,#ffd36e,#ff8a5c);display:grid;place-items:center;box-shadow:0 3px 10px rgba(255,138,92,.35)}
.idea .spark svg{width:20px;height:20px}
.idea .t{font-size:15px;font-weight:750;letter-spacing:-.3px;margin-top:2px}
.idea .s{font-size:13px;color:var(--ink2);line-height:1.4;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.locked .private{display:none !important}
/* Foldables: the narrow cover screen (and older, narrower covers), then the opened inner screen, square-ish and wide. */
@media (max-width:380px){
  .wrap{padding-left:13px;padding-right:13px;gap:10px}
  .clock{font-size:54px;letter-spacing:-2px}.clock small{font-size:19px}
  .hello{font-size:15px}.date{font-size:14px}
  .buddy{width:88px;height:104px}.buddy .body{height:76px}
  .grid{gap:10px}.card{padding:13px 14px;border-radius:23px}
  .cal{width:52px;height:56px}.cal .day{font-size:25px}
  .ev-title{font-size:15.5px}
  .coin .px{font-size:16px}.coin-list{gap:6px}.pct{font-size:11px;padding:2px 5px}
}
@media (min-width:600px){
  .wrap{max-width:840px;margin:0 auto;padding-left:28px;padding-right:28px;gap:14px}
  .clock{font-size:76px}
  .grid{grid-template-columns:repeat(4,1fr);gap:14px}
  .event{align-items:center}
  .bubble{max-width:320px}
}
@media (min-width:600px) and (max-height:760px){
  .wrap{padding-top:max(40px,5vh);gap:12px}
  .hero{min-height:92px}.clock{font-size:58px}
}
@media (prefers-reduced-motion:reduce){.blob,.buddy .body,.buddy .ground,.star,.zz,.dots i{animation:none !important}}
</style>
</head>
<body>
<div id="track"></div>
<script>/*GYEOT*/</script>
<script>
"use strict";
const G = window.GYEOT || {slots:[{src:"home",title:"퍼레 홈"}], photo:false, photoAt:0, mascot:false, start:0};
const $ = (root, sel) => root.querySelector(sel);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const track = document.getElementById("track");
let pos = G.start || 0, info = null, lockedNow = false;
const boards = [], frames = [];

/* ── icons (simple rounded strokes) ───────────────────────── */
const ICON = {
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="#2dbe60" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4-4 3.5 3L19 7.5"/><path d="M15 7.5h4v4"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5l2.1 6.2 6.4 2.3-6.4 2.3L12 19.5l-2.1-6.2L3.5 11l6.4-2.3z"/><circle cx="19" cy="4.5" r="1.6"/><circle cx="5" cy="19" r="1.3"/></svg>'
};
/* The friend when no avatar was made: a round coral buddy whose eyes blink. */
const BUDDY = '<svg viewBox="0 0 100 100"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a76"/><stop offset="1" stop-color="#ff6a45"/></linearGradient></defs>'
  + '<line x1="50" y1="17" x2="50" y2="7" stroke="#ff6a45" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="6" r="5" fill="#ffd36e"/>'
  + '<rect x="12" y="17" width="76" height="70" rx="30" fill="url(#bg)"/><rect x="22" y="30" width="56" height="36" rx="18" fill="#fff" opacity=".95"/>'
  + '<g class="eyes"><rect x="35" y="39" width="8" height="14" rx="4" fill="#2b2b3a"><animate attributeName="height" values="14;14;2;14;14" keyTimes="0;.9;.94;.98;1" dur="4.5s" repeatCount="indefinite"/><animate attributeName="y" values="39;39;45;39;39" keyTimes="0;.9;.94;.98;1" dur="4.5s" repeatCount="indefinite"/></rect>'
  + '<rect x="57" y="39" width="8" height="14" rx="4" fill="#2b2b3a"><animate attributeName="height" values="14;14;2;14;14" keyTimes="0;.9;.94;.98;1" dur="4.5s" repeatCount="indefinite"/><animate attributeName="y" values="39;39;45;39;39" keyTimes="0;.9;.94;.98;1" dur="4.5s" repeatCount="indefinite"/></rect></g>'
  + '<circle cx="29" cy="58" r="4.5" fill="#ff8fa3" opacity=".75"/><circle cx="71" cy="58" r="4.5" fill="#ff8fa3" opacity=".75"/></svg>';

function makeBoard(slot) {
  const b = document.createElement("section"); b.className = "board";
  let stars = "";
  for (let i = 0; i < 14; i++) { const x = (i * 37 + 11) % 100, y = (i * 53 + 7) % 46, d = (i * 0.7) % 5; stars += '<i class="star" style="left:' + x + '%;top:' + y + '%;animation-delay:' + d.toFixed(1) + 's"></i>'; }
  b.innerHTML =
    '<div class="sky"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><div class="stars">' + stars + '</div></div>'
  + '<div class="wrap">'
  +   '<header class="hero"><div class="when"><div class="date"></div><div class="clock"></div><div class="hello"></div></div>'
  +     '<button class="buddy" aria-label="퍼레"><div class="bubble"></div><span class="think private"><span class="dots"><i></i><i></i><i></i></span><span class="n"></span></span><span class="zz">z</span><div class="body">' + (G.mascot ? '<img alt="" class="' + (G.mascotKind === "round" ? "round" : "") + '" src="/mascot.png?v=' + encodeURIComponent(G.mascotAt || 0) + '">' : BUDDY) + '</div><div class="ground"></div></button></header>'
  +   '<div class="grid">'
  +     '<div class="card wide event tap private" data-go="calendar" data-rank="5"><div class="cal"><span class="dow"></span><span class="day"></span></div><div class="ev"><div class="eyebrow">다음 일정</div><div class="ev-title">일정을 보는 중…</div><div class="ev-meta"></div></div><div class="soon"></div></div>'
  +     '<div class="card wide coins tap" data-go="trading" data-rank="4"><div class="eyebrow">' + ICON.chart + '시세</div><div class="coin-list"><div class="muted">시세를 받는 중…</div></div></div>'
  +     '<div class="card wide notices tap private hidden" data-go="notices" data-rank="1"><div class="eyebrow">' + ICON.bell + '알림<span class="count"></span></div><div class="list"></div></div>'
  +     '<div class="card wide idea-card tap private hidden" data-go="home" data-rank="2"><div class="idea"><div class="spark">' + ICON.spark + '</div><div><div class="eyebrow">이건 어때요?</div><div class="t"></div><div class="s"></div></div></div></div>'
  +   '</div>'
  + '</div>';
  slot.appendChild(b);
  // Cards pop in one after another, like a console's home screen waking up.
  b.querySelectorAll(".hero,.grid>.card").forEach((c, i) => { c.classList.add("pop"); c.style.animationDelay = (60 + i * 55) + "ms"; });
  const buddy = $(b, ".buddy");
  buddy.addEventListener("click", () => cheer(b));
  setInterval(() => { if (!document.hidden && !buddy.classList.contains("hop")) { buddy.classList.add("wiggle"); setTimeout(() => buddy.classList.remove("wiggle"), 950); } }, 14000);
  wireTaps(b); tick(b);
  return b;
}

/* Touch: a soft press, a springy release, then the screen opens (the app handles /do/…). */
function wireTaps(root) {
  root.querySelectorAll(".tap").forEach(el => {
    let x = 0, y = 0, moved = false;
    el.addEventListener("pointerdown", e => { x = e.clientX; y = e.clientY; moved = false; el.classList.add("down"); });
    el.addEventListener("pointermove", e => { if (Math.abs(e.clientX - x) + Math.abs(e.clientY - y) > 12) { moved = true; el.classList.remove("down"); } });
    const up = () => el.classList.remove("down");
    el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up); el.addEventListener("pointerleave", up);
    el.addEventListener("click", () => { if (moved || lockedNow) return; const what = el.dataset.go; setTimeout(() => go(what), 140); });
  });
}
function go(what) {
  if (what === "calendar" && info && info.calendarOn === false) what = "calendarSettings";
  location.href = "/do/" + encodeURIComponent(what);
}

/* ── time ─────────────────────────────────────────────────── */
const DOW = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
function tone(h) { return h >= 5 && h < 10 ? "morning" : h >= 10 && h < 17 ? "day" : h >= 17 && h < 20 ? "evening" : "night"; }
function hello(h) {
  return h < 5 ? "조용한 새벽이에요" : h < 11 ? "좋은 아침이에요" : h < 14 ? "맛있는 점심 드세요" : h < 18 ? "오후도 힘내요" : h < 22 ? "편안한 저녁이에요" : "오늘도 수고했어요";
}
function tick(b) {
  const d = new Date(), h = d.getHours(), m = d.getMinutes();
  if (b.dataset.tone !== tone(h)) b.dataset.tone = tone(h);
  $(b, ".date").textContent = (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + DOW[d.getDay()];
  $(b, ".clock").innerHTML = "<small>" + (h < 12 ? "오전" : "오후") + "</small>" + ((h % 12) || 12) + ":" + String(m).padStart(2, "0");
  $(b, ".hello").textContent = hello(h);
  $(b, ".cal .dow").textContent = DOW[d.getDay()];
  $(b, ".cal .day").textContent = d.getDate();
}
setInterval(() => boards.forEach(tick), 10000);
function clockOf(ms) { const d = new Date(ms), h = d.getHours(); return (h < 12 ? "오전 " : "오후 ") + ((h % 12) || 12) + ":" + String(d.getMinutes()).padStart(2, "0"); }
function until(ms, end) {
  const now = Date.now();
  if (ms <= now && end > now) return {text: "진행 중", now: true};
  const min = Math.round((ms - now) / 60000);
  if (min < 1) return {text: "곧", now: false};
  if (min < 60) return {text: min + "분 후", now: false};
  const hr = Math.round(min / 60);
  return {text: hr < 24 ? hr + "시간 후" : "내일", now: false};
}
function ago(ms) { const min = Math.max(0, Math.round((Date.now() - ms) / 60000)); return min < 1 ? "방금" : min < 60 ? min + "분 전" : Math.round(min / 60) + "시간 전"; }
function money(v) { return "$" + (v >= 1000 ? Math.round(v).toLocaleString("en-US") : v >= 1 ? v.toFixed(2) : v.toPrecision(3)); }
const APP_COLORS = ["#ff6b4a","#7c5cff","#12b5a6","#ff9f0a","#3182f6","#ff3b5c","#2dbe60","#af52de"];
function hue(s) { let n = 0; for (const c of String(s)) n = (n * 31 + c.codePointAt(0)) >>> 0; return APP_COLORS[n % APP_COLORS.length]; }

/* ── what the app says ────────────────────────────────────── */
function show(b) {
  const k = info || {};
  b.classList.toggle("locked", !!k.locked);
  // 시세: BTC · SOXL · KORU
  const coins = k.quotes || [];
  $(b, ".coin-list").innerHTML = coins.length === 0 ? '<div class="muted">시세를 받지 못했어요</div>' : coins.map(c => {
    const dir = c.change >= 0 ? "up" : "down", sign = c.change >= 0 ? "+" : "";
    return '<div class="coin"><b>' + esc(c.symbol) + '</b><span class="px">' + money(c.price) + '</span><span class="pct ' + dir + '">' + sign + c.change.toFixed(2) + '%</span></div>';
  }).join("");
  if (k.locked) { fit(b); return; }
  // 다음 일정
  const ev = $(b, ".event");
  if (k.calendarOn === false) { $(ev, ".ev-title").textContent = "캘린더를 연결해 주세요"; $(ev, ".ev-meta").textContent = "다음 일정이 여기에 보여요"; $(ev, ".soon").textContent = ""; }
  else if (!k.next) { $(ev, ".ev-title").textContent = "오늘 남은 일정이 없어요"; $(ev, ".ev-meta").textContent = "편하게 보내도 돼요"; $(ev, ".soon").textContent = ""; }
  else {
    const n = k.next, u = until(n.begin, n.end);
    $(ev, ".ev-title").textContent = n.title;
    $(ev, ".ev-meta").textContent = (n.allDay ? "하루 종일" : clockOf(n.begin) + " – " + clockOf(n.end).replace(/^오[전후] /, "")) + (n.place ? " · " + n.place : "") + (k.eventsLeft > 1 ? " · 그 뒤로 " + (k.eventsLeft - 1) + "개" : "");
    const soon = $(ev, ".soon"); soon.textContent = n.allDay ? "오늘" : u.text; soon.classList.toggle("now", u.now);
  }
  // 알림
  const nc = $(b, ".notices"), list = k.notices || [];
  nc.classList.toggle("hidden", !Array.isArray(k.notices) || list.length === 0);
  $(nc, ".count").textContent = k.noticeCount > 0 ? k.noticeCount : "";
  $(nc, ".list").innerHTML = list.slice(0, 2).map(n => '<div class="note"><div class="app" style="background:' + hue(n.app) + '">' + esc(Array.from(n.app || "?")[0]) + '</div><div class="words"><div class="t">' + esc(n.title || n.app) + '</div><div class="s">' + esc(n.text) + '</div></div><div class="ago">' + ago(n.at) + '</div></div>').join("");
  // 퍼레의 제안
  const idea = $(b, ".idea-card"), s = (k.suggestions || [])[0];
  idea.classList.toggle("hidden", !s);
  if (s) { $(idea, ".t").textContent = s.title; $(idea, ".s").textContent = s.body; }
  // 일하는 중: a thought bubble over 퍼레 (its count, or 실험 for the lab)
  const think = $(b, ".think"), busy = (k.working || 0) > 0 || k.lab;
  think.classList.toggle("on", busy);
  $(think, ".n").textContent = k.working > 0 ? k.working : "실험";
  fit(b);
}
/* The board keeps to the top half: the rest is the home screen's own icons (준: "아이콘들이 배치될 공간을 확보"). What does not
   fit goes, least needed first (lowest rank: notices, then 퍼레's suggestion, then the coins, then the event). */
function fit(b) {
  const wrap = $(b, ".wrap"), room = innerHeight * 0.5;
  const cards = Array.from(b.querySelectorAll(".grid>.card[data-rank]"));
  cards.forEach(c => c.style.display = "");
  const shown = cards.filter(c => !c.classList.contains("hidden") && getComputedStyle(c).display !== "none").sort((a, c) => (+a.dataset.rank) - (+c.dataset.rank));
  for (const c of shown) { if (wrap.scrollHeight <= room) break; c.style.display = "none"; }
  // Opened wide (a foldable's inner screen), a wide card left alone on its row takes the whole row.
  const wides = Array.from(b.querySelectorAll(".grid>.notices,.grid>.idea-card")).filter(c => c.style.display !== "none" && getComputedStyle(c).display !== "none");
  b.querySelectorAll(".grid>.notices,.grid>.idea-card").forEach(c => c.style.gridColumn = innerWidth >= 600 && wides.length === 1 && wides[0] === c ? "1 / -1" : "");
}
function say(b) {
  const k = info || {}, lines = [];
  if (!k.locked && k.next) lines.push("다음은 ‘" + k.next.title + "’" + (k.next.allDay ? ", 오늘 하루 종일이에요" : ", " + clockOf(k.next.begin) + "이에요!"));
  if (!k.locked && k.working > 0) lines.push("맡긴 일 " + k.working + "개를 열심히 하고 있어요");
  if (!k.locked && k.lab) lines.push("연구실에서 실험을 돌리고 있어요");
  for (const q of k.quotes || []) lines.push((q.symbol === "BTC" ? "비트코인" : q.symbol) + " · 하루 사이 " + Math.abs(q.change).toFixed(1) + "% " + (q.change >= 0 ? "올랐어요" : "내렸어요"));
  if (!k.locked && k.noticeCount > 0) lines.push("새 알림이 " + k.noticeCount + "개 있어요");
  lines.push("부를 땐 오른쪽 바를 당겨 주세요", hello(new Date().getHours()) + "!", "오늘도 같이 힘내요");
  b._said = ((b._said || 0) + 1) % lines.length;
  return lines[b._said];
}
function cheer(b) {
  const buddy = $(b, ".buddy"), bubble = $(b, ".bubble");
  buddy.classList.remove("hop", "wiggle"); void buddy.offsetWidth; buddy.classList.add("hop");
  setTimeout(() => buddy.classList.remove("hop"), 760);
  bubble.textContent = say(b); bubble.classList.add("on");
  clearTimeout(b._bubble); b._bubble = setTimeout(() => bubble.classList.remove("on"), 3400);
}

/* ── slots ────────────────────────────────────────────────── */
function build() { G.slots.forEach((slot, i) => {
  const el = document.createElement("div"); el.className = "slot"; el.style.left = (i * 100) + "vw"; track.appendChild(el);
  if (slot.src === "photo") {
    const p = document.createElement("div"); p.className = "photo";
    if (G.photo) p.style.backgroundImage = "url(/photo.jpg?v=" + encodeURIComponent(G.photoAt || 0) + ")";
    else p.innerHTML = '<div class="hint">들퍼레 → 화면 꾸미기에서<br>이 페이지에 깔 사진을 골라 주세요</div>';
    el.appendChild(p);
  } else if (slot.src === "home") {
    boards.push(makeBoard(el));
  } else {
    const f = document.createElement("iframe");
    f.setAttribute("sandbox", "allow-scripts allow-same-origin allow-pointer-lock");
    f.setAttribute("allow", "autoplay; accelerometer; gyroscope");
    f.setAttribute("title", slot.title || "");
    el.appendChild(f);
    frames.push({i, f, src: slot.src.startsWith("page:") ? "https://pages.gyeot.local/" + encodeURIComponent(slot.src.slice(5)) : slot.src, on: false, far: 0});
  }
}); }

/* ── the app's calls ──────────────────────────────────────── */
window.board = {
  /** The launcher page (fractional mid-swipe): the slots slide with it. */
  at(page) {
    const last = Math.max(0, G.slots.length - 1);
    pos = Math.max(0, Math.min(last, +page || 0));
    track.style.transform = "translate3d(" + (-pos * 100) + "vw,0,0)";
    // A piece starts when its page comes near and stops when it is far (only what is seen keeps running).
    for (const fr of frames) {
      const d = Math.abs(fr.i - pos);
      if (d < 1.02 && !fr.on) { fr.on = true; fr.f.src = fr.src; }
      if (d >= 2 && fr.on) { fr.on = false; fr.f.src = "about:blank"; }
    }
  },
  data(k) {
    info = k || {}; lockedNow = !!info.locked;
    boards.forEach(show);
  }
};
build();
board.at(pos);
addEventListener("resize", () => boards.forEach(fit));
</script>
</body>
</html>
